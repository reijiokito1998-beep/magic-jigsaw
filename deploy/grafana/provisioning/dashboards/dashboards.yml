apiVersion: 1

providers:
  - name: jigsaw
    orgId: 1
    folder: Jigsaw
    type: file
    disableDeletion: false
    # Dashboards are code: edits in the UI are overwritten by the files on disk.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
